<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Meta Verification Tag PopCash (Telah Dirapikan) -->
    <meta name="ppck-ver" content="8c912afaea1050da530ab13198a3e3ab" />
    
    <title>Peringatan Akses 18+</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .card {
            background: #1f2833;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 24px 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }

        .badge-18 {
            background-color: #e50914;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #fff;
            line-height: 1.4;
        }

        p.desc {
            font-size: 14px;
            color: #c5c6c7;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .step-container {
            display: block;
        }

        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            padding: 14px 0;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 12px;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #2c3e50;
            box-shadow: none;
            color: #bdc3c7;
        }
